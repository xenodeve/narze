# Local development and test infrastructure for Narze v7.
# Supabase local runs separately via the Supabase CLI (`bun run infra:up` starts both).
# A fixed project name: the T4 gate runs `infra:up` from a worktree with another folder name, and
# must reuse this Redis instead of starting a second one on the same port.
name: narze
services:
  redis:
    image: redis:7.4-alpine
    # Local only: Redis has no password, and anyone who can publish could fake Bot events (#114).
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    profiles: ["audio"]
    ports: ["127.0.0.1:2333:2333"]
    environment:
      SERVER_PORT: 2333
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      # YouTube's TV client needs its player-script signatures solved: yt-cipher below (measured 2026-11-09).
      PLUGINS_YOUTUBE_REMOTECIPHER_URL: http://yt-cipher:8001
      PLUGINS_YOUTUBE_REMOTECIPHER_PASSWORD: ${YT_CIPHER_TOKEN:-narze-local-cipher}
      # Spotify search (LavaSrc) only when credentials are set in your shell (spec #55).
      PLUGINS_LAVASRC_SOURCES_SPOTIFY: ${LAVASRC_SPOTIFY_ENABLED:-false}
      PLUGINS_LAVASRC_SPOTIFY_CLIENTID: ${LAVASRC_SPOTIFY_CLIENT_ID:-}
      PLUGINS_LAVASRC_SPOTIFY_CLIENTSECRET: ${LAVASRC_SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - ./infra/lavalink/application.yml:/opt/Lavalink/application.yml:ro
    depends_on: [yt-cipher]

  # Solves YouTube's player-script signatures for Lavalink's youtube-plugin (remoteCipher). Third-party
  # (github.com/kikkia/yt-cipher), so pinned by digest; reachable only on the compose network, and it
  # takes the same token Lavalink sends.
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher@sha256:4c5ec381ff57336cfc24822d2b526a5ad7cd0171f61065a1bbc87bb736842449
    profiles: ["audio"]
    # No host port: only Lavalink calls it, over the compose network.
    environment:
      API_TOKEN: ${YT_CIPHER_TOKEN:-narze-local-cipher}
