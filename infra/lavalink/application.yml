# Lavalink 4 for local development (docker compose --profile audio up -d lavalink).
# Plugin versions match the ones v5.0.2 ran in production. Spotify via LavaSrc is off unless
# credentials come from the environment (never this file): PLUGINS_LAVASRC_SOURCES_SPOTIFY=true,
# PLUGINS_LAVASRC_SPOTIFY_CLIENTID, PLUGINS_LAVASRC_SPOTIFY_CLIENTSECRET. The Bot searches Spotify
# first only when the node reports a `spotify` source manager (#100, spec #55).
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # A snapshot pinned to a commit, not a release: 1.18.2 (the latest release) cannot play on this
    # network (every client refused, measured 2026-11-09). Commit b33460b (TV client User-Agent) fixes
    # "The page needs to be reloaded" (youtube-source #226) and is not released yet. Move back to a
    # release once one includes it.
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
  server:
    # LAVALINK_SERVER_PASSWORD from docker-compose.yml overrides this.
    password: "youshallnotpass"
    sources:
      # The built-in YouTube source is deprecated; youtube-plugin replaces it.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: false
      vimeo: false
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    trackStuckThresholdMs: 10000
    playerUpdateInterval: 5
    youtubePlaylistLoadLimit: 6
    resamplingQuality: LOW
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # MUSIC and WEB search; TV plays, with its signatures solved by yt-cipher (remoteCipher, set in
    # docker-compose.yml). Measured 2026-11-09: without the cipher TV fails "Must find sig function";
    # no sign-in (OAuth) is needed; the others are refused (login required, SABR-only, "not a bot").
    clients: ["MUSIC", "TV", "WEB", "ANDROID_VR"]
  lavasrc:
    providers:
      - 'ytsearch:"%ISRC%"'
      - "ytsearch:%QUERY%"
    # Spec #56: market TH, playlists and albums up to 50 tracks.
    spotify:
      countryCode: "TH"
      playlistLoadLimit: 50
      albumLoadLimit: 50
    sources:
      spotify: false
      applemusic: false
      deezer: false
      yandexmusic: false

logging:
  level:
    root: INFO
    lavalink: INFO
