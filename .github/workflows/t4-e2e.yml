# T4 e2e — the slow suite, deliberately NOT in `.claude/t4.json` "verify".
#
# Why separate: the local gate runs `verify` on every `gh pr merge`, so a suite
# that takes minutes makes shipping expensive (issue #13). E2E belongs here,
# where it runs once per push in parallel with the rest of the gate.
#
# Install as `.github/workflows/t4-e2e.yml`. Required check name: `e2e`.
#
# START ADVISORY — leave it out of the ruleset at first. A flaky e2e made
# required is how a team learns to merge with the gate disabled.
# FLIP CONDITION: add `{ "context": "e2e" }` to required_status_checks once this
# has been green on `main` for a week with no re-runs. Write the date you started
# counting here, so "advisory" can't quietly become permanent:
#   advisory since: 2026-11-08
# (Same discipline as a `continue-on-error` gate — a provisional check with no
# stated flip condition is a permanent one. See ci-cd-layer.md.)
name: T4 e2e

on:
  pull_request:
    branches: [v7]

concurrency:
  group: t4-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20                   # a hung browser must not pin a runner
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # packageManager pins Bun in one place
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/dashboard
      - run: bun run e2e                  # xenodeve/narze end-to-end suite (apps/dashboard Playwright)
      # The artifact is what makes a red e2e diagnosable without a local repro —
      # without it the agent only sees "e2e failed".
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: |
            apps/dashboard/playwright-report/
            apps/dashboard/test-results/
          retention-days: 7
          if-no-files-found: ignore

# T4 rule this enforces: every frontend change is verified end-to-end — unit
# tests can't see real layout or hydration. Add a case per new page /
# interactive component; a PR that adds UI and no e2e case is incomplete.
